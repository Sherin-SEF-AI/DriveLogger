// Blurabbit DriveLogger custom MCAP schemas.
// All timestamps are nanoseconds on the unified elapsedRealtime timebase (see :core:clock).
syntax = "proto3";

package blurabbit;

option java_package = "com.blurabbit.drivelogger.proto";
option java_outer_classname = "SensorsProto";
option java_multiple_files = true;

// Generic 3-axis sample (accelerometer m/s^2, gyroscope rad/s, magnetometer uT, gravity,
// linear acceleration). Reused across all /imu/* vector topics.
message Vector3Stamped {
  int64 unified_ns = 1;   // unified timebase
  double x = 2;
  double y = 3;
  double z = 4;
  int32 accuracy = 5;     // SensorManager accuracy level (-1 unknown)
}

// Rotation vector / orientation as a unit quaternion (ROTATION_VECTOR / GAME_ROTATION_VECTOR).
message QuaternionStamped {
  int64 unified_ns = 1;
  double w = 2;
  double x = 3;
  double y = 4;
  double z = 5;
  double heading_accuracy_rad = 6;
}

// Environmental sensors; fields are NaN when the sensor is absent on the device.
message Environment {
  int64 unified_ns = 1;
  double pressure_hpa = 2;       // barometer
  double ambient_light_lux = 3;
  double temperature_c = 4;
  double relative_humidity = 5;  // 0..100 %
}

// Per-frame camera metadata. The pixels live in the sidecar MP4 (trip_NNN.mp4) — only the
// reference + capture parameters are logged here, keeping MCAP small.
message CameraFrameMeta {
  int64 unified_ns = 1;          // frame presentation time on unified clock
  int64 frame_id = 2;            // monotonically increasing per camera
  string video_uri = 3;          // e.g. "trip_001.mp4"
  string camera_id = 4;          // "front" | "rear" | usb id
  int64 exposure_time_ns = 5;
  int32 iso = 6;
  double focal_length_mm = 7;
  int32 width = 8;
  int32 height = 9;
  string codec = 10;             // "h264" | "h265"
  // Rolling-shutter readout time (CaptureResult.SENSOR_ROLLING_SHUTTER_SKEW): the delay between the
  // first and last row's exposure. Critical for fusing the camera with high-rate motion. 0 if absent.
  int64 rolling_shutter_skew_ns = 11;
  // CameraCharacteristics.SENSOR_INFO_TIMESTAMP_SOURCE (0=UNKNOWN,1=REALTIME). Tells consumers which
  // epoch SENSOR_TIMESTAMP used, so the unified-clock mapping can be interpreted/trusted.
  int32 sensor_timestamp_source = 12;
}

// One satellite observation within a GnssRaw message.
message Satellite {
  int32 constellation = 1;       // GnssStatus.CONSTELLATION_* (1=GPS,3=GLONASS,4=QZSS,5=BEIDOU,6=GALILEO,7=IRNSS/NavIC)
  int32 svid = 2;
  double cn0_dbhz = 3;
  double elevation_deg = 4;
  double azimuth_deg = 5;
  bool used_in_fix = 6;
  double carrier_freq_hz = 7;
}

// Raw GNSS measurements + satellite status (advanced; populated where the API/device allows).
message GnssRaw {
  int64 unified_ns = 1;
  int32 satellites_total = 2;
  int32 satellites_used = 3;
  repeated Satellite satellites = 4;
  // Per-constellation visible counts, keyed by GnssStatus.CONSTELLATION_*.
  map<int32, int32> constellation_counts = 5;
}

// Receiver clock snapshot from android.location.GnssClock — the time base PPK/RTKLIB needs to
// reconstruct pseudoranges from received-SV-time.
message GnssClockSample {
  int64 time_nanos = 1;                        // GnssClock.getTimeNanos()
  int64 full_bias_nanos = 2;                   // getFullBiasNanos() (GPS-time minus hw clock)
  double bias_nanos = 3;                       // getBiasNanos()
  double bias_uncertainty_nanos = 4;
  double drift_nanos_per_second = 5;
  double drift_uncertainty_nps = 6;
  int32 hardware_clock_discontinuity_count = 7;
  int32 leap_second = 8;
  bool has_leap_second = 9;
}

// One raw android.location.GnssMeasurement (per satellite, per epoch).
message GnssMeasurement {
  int32 svid = 1;
  int32 constellation = 2;                     // GnssStatus.CONSTELLATION_*
  double time_offset_nanos = 3;
  int32 state = 4;                             // sync-state bitfield (getState())
  int64 received_sv_time_nanos = 5;
  int64 received_sv_time_uncertainty_nanos = 6;
  double cn0_dbhz = 7;
  double pseudorange_rate_mps = 8;             // getPseudorangeRateMetersPerSecond()
  double pseudorange_rate_uncertainty_mps = 9;
  int32 accumulated_delta_range_state = 10;    // carrier-phase validity bitfield
  double accumulated_delta_range_meters = 11;  // carrier phase
  double accumulated_delta_range_uncertainty_m = 12;
  double carrier_frequency_hz = 13;            // L1/L5 etc.
  int32 multipath_indicator = 14;
}

// A full raw-measurement epoch (clock + all visible satellites) for offline PPK/RTK.
message GnssMeasurements {
  int64 unified_ns = 1;
  GnssClockSample clock = 2;
  repeated GnssMeasurement measurements = 3;
}

// Per-chunk microphone metadata. Raw PCM lives in the sidecar audio.wav; only level/index here.
message AudioChunkMeta {
  int64 unified_ns = 1;
  int64 sample_index = 2;        // running PCM sample offset into audio.wav
  double rms_dbfs = 3;           // chunk loudness, dBFS (<= 0)
  double peak_dbfs = 4;
  int32 sample_rate_hz = 5;
  int32 channels = 6;
}

// Timestamped raw-PCM audio frame carried INSIDE the MCAP (topic /audio/pcm), like camera frames —
// makes the MCAP a single source of truth. unified_ns is HAL-clock anchored; sample_index is exact.
// The audio.wav sidecar remains the guaranteed-lossless copy (MCAP frames are best-effort).
message AudioFrame {
  int64 unified_ns = 1;
  int64 sample_index = 2;        // first PCM sample in this frame
  int32 sample_rate_hz = 3;
  int32 channels = 4;
  bytes pcm_s16le = 5;           // little-endian signed 16-bit PCM
}

// Fix-level GPS data mirrored in a Blurabbit message for fields not in foxglove.LocationFix
// (speed, bearing, accuracies). foxglove.LocationFix is logged in parallel for Studio.
message GpsExtras {
  int64 unified_ns = 1;
  double speed_mps = 2;
  double bearing_deg = 3;
  double horizontal_accuracy_m = 4;
  double vertical_accuracy_m = 5;
  double speed_accuracy_mps = 6;
  double bearing_accuracy_deg = 7;
  // Dilution of precision from the NMEA GSA sentence (0 = not yet observed).
  double pdop = 8;
  double hdop = 9;
  double vdop = 10;
}

// Device health / telemetry snapshot.
message DeviceTelemetry {
  int64 unified_ns = 1;
  double battery_pct = 2;
  bool charging = 3;
  double cpu_temperature_c = 4;
  int64 ram_used_bytes = 5;
  int64 ram_total_bytes = 6;
  int64 storage_free_bytes = 7;
  int64 storage_total_bytes = 8;
  string network_type = 9;       // "WIFI" | "CELLULAR" | "NONE"
  int32 signal_strength_dbm = 10;
  int32 thermal_status = 11;     // PowerManager.THERMAL_STATUS_*
}

// Detected driving event. Mirrored to the Room `events` table.
message DrivingEvent {
  int64 unified_ns = 1;
  EventType type = 2;
  double confidence = 3;         // 0..1
  string evidence_json = 4;      // compact sensor evidence snapshot
  double latitude = 5;
  double longitude = 6;
  double speed_mps = 7;

  enum EventType {
    UNKNOWN = 0;
    HARD_BRAKING = 1;
    SUDDEN_ACCELERATION = 2;
    SHARP_TURN = 3;
    POTHOLE_IMPACT = 4;
    SPEED_BUMP = 5;
    RAPID_LANE_CHANGE = 6;
    AGGRESSIVE_DRIVING = 7;
    SIREN = 8;            // emergency-vehicle siren (audio classifier)
    VEHICLE_HORN = 9;     // car/truck horn (audio classifier)
  }
}
